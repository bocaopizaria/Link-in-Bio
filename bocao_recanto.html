<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bocão Pizzaria – Recanto das Emas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700&family=IM+Fell+English:ital@1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --yellow: #FFD600;
    --orange: #FF6B00;
    --black: #0A0A0A;
    --card: #141414;
    --text: #F0F0F0;
    --muted: #888;
  }

  body {
    background-color: var(--black);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px 60px;
    position: relative;
    overflow-x: hidden;
  }

  /* Animated background glow */
  body::before {
    content: '';
    position: fixed;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(255,214,0,0.12) 0%, transparent 70%);
    pointer-events: none;
    animation: pulse 4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.15); }
  }

  .container {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* Profile section */
  .profile {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
    animation: fadeDown 0.7s ease both;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .avatar-wrap {
    position: relative;
    width: 150px;
    height: 150px;
  }

  .avatar-wrap img {
    position: absolute;
    inset: 22px;
    width: calc(100% - 44px);
    height: calc(100% - 44px);
    border-radius: 50%;
    object-fit: cover;
    z-index: 2;
  }

  .circular-text {
    position: absolute;
    top: 0; left: 0;
    width: 150px;
    height: 150px;
    animation: spin 10s linear infinite;
    z-index: 3;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .circular-text text {
    font-family: 'IM Fell English', 'Playfair Display', Georgia, serif;
    font-size: 13.5px;
    font-weight: bold;
    fill: var(--yellow);
    letter-spacing: 5.2px;
    text-transform: uppercase;
  }

  .profile-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 3px;
    color: var(--yellow);
    text-align: center;
    line-height: 1;
  }

  .profile-unit {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--orange);
    text-transform: uppercase;
    margin-top: -8px;
  }

  .profile-bio {
    font-size: 0.88rem;
    color: var(--muted);
    text-align: center;
    line-height: 1.5;
    max-width: 280px;
  }

  /* Divider */
  .divider {
    width: 40px;
    height: 3px;
    background: linear-gradient(90deg, var(--yellow), var(--orange));
    border-radius: 2px;
    margin-bottom: 24px;
  }

  /* Links */
  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
  }

  .link-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 16px 20px;
    background: var(--card);
    border: 1px solid #222;
    border-radius: 14px;
    text-decoration: none;
    color: var(--text);
    font-weight: 700;
    font-size: 0.95rem;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.6s ease both;
  }

  .link-btn:nth-child(1) { animation-delay: 0.15s; }
  .link-btn:nth-child(2) { animation-delay: 0.25s; }
  .link-btn:nth-child(3) { animation-delay: 0.35s; }
  .link-btn:nth-child(4) { animation-delay: 0.45s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .link-btn::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, var(--yellow), var(--orange));
    border-radius: 4px 0 0 4px;
  }

  .link-btn:hover {
    background: #1e1e1e;
    border-color: var(--yellow);
    transform: translateX(4px);
    box-shadow: 0 0 20px rgba(255,214,0,0.1);
  }

  .link-btn:active {
    transform: scale(0.98) translateX(4px);
  }

  .link-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    flex-shrink: 0;
  }

  .icon-cardapio { background: rgba(255,214,0,0.12); }
  .icon-location { background: rgba(255,107,0,0.12); }
  .icon-whatsapp { background: rgba(37,211,102,0.12); }
  .icon-instagram { background: rgba(193,53,132,0.12); }

  .link-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .link-title {
    color: var(--text);
    font-size: 0.95rem;
  }

  .link-sub {
    color: var(--muted);
    font-size: 0.75rem;
    font-weight: 400;
  }

  .link-arrow {
    margin-left: auto;
    color: var(--muted);
    font-size: 1rem;
    transition: transform 0.2s;
  }

  .link-btn:hover .link-arrow {
    transform: translateX(3px);
    color: var(--yellow);
  }

  /* Footer */
  .footer {
    margin-top: 36px;
    text-align: center;
    color: #333;
    font-size: 0.72rem;
    letter-spacing: 1px;
    animation: fadeUp 0.6s 0.55s ease both;
  }

  .footer span {
    color: var(--orange);
  }

  /* Gallery */
  .gallery-title {
    margin-top: 36px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 4px;
    color: var(--muted);
    text-align: center;
    animation: fadeUp 0.6s 0.5s ease both;
  }

  .gallery {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 8px;
    width: 100%;
    margin-top: 14px;
    animation: fadeUp 0.6s 0.6s ease both;
  }

  .gallery-item {
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
  }

  .gallery-item:first-child {
    grid-column: 1 / -1;
  }

  .gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
    border-radius: 12px;
  }

  .gallery-item:first-child img {
    max-height: 200px;
    object-position: center 40%;
  }

  .gallery-item:not(:first-child) img {
    height: 140px;
  }

  .gallery-item:hover img {
    transform: scale(1.05);
  }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .lightbox.active { display: flex; }
  .lightbox img {
    max-width: 92vw;
    max-height: 88vh;
    border-radius: 12px;
    object-fit: contain;
  }
  .lightbox-close {
    position: absolute;
    top: 20px; right: 24px;
    color: #fff;
    font-size: 2rem;
    cursor: pointer;
    line-height: 1;
  }
</style>
</head>
